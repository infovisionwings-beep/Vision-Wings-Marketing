<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loader — Logo Assembly Animation</title>

<!--
  ============================================================
  LOGO LOADER — integration notes
  ============================================================
  Everything between <div id="site-loader"> ... </div> is the
  reusable piece. Drop it (plus the CSS in #site-loader and below,
  plus the two lines of JS at the bottom) into your real site.

  To dismiss it when YOUR page is actually ready, don't use the
  setTimeout demo below — call hideLoader() from your own
  "content ready" signal instead, e.g.:

      window.addEventListener('load', hideLoader);
      // or after your app hydrates / fonts load / first data fetch resolves

  Customise:
   - Colours: the 7 custom properties at the top of <style>.
   - Speed: search for "TIMING" comments in the CSS.
   - Everything is plain CSS + ~10 lines of JS. No build step.
  ============================================================
-->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
  :root{
    --navy: #0F172A;
    --copper: #B87333;
    --spark: #22FF44;
    --canvas-1: #FBFCFD;
    --canvas-2: #E7EAEF;
    --ring-line: rgba(15,23,42,.13);
    --label-ink: rgba(15,23,42,.62);
  }

  *{ box-sizing:border-box; }
  html,body{ margin:0; height:100%; }
  body{
    min-height:100vh;
    background: radial-gradient(circle at 50% 42%, var(--canvas-1), var(--canvas-2));
    font-family:'IBM Plex Mono', ui-monospace, Menlo, monospace;
    overflow:hidden;
  }

  /* ============ LOADER — copy from here down ============ */

  #site-loader{
    position:fixed; inset:0;
    display:flex; align-items:center; justify-content:center;
    background: radial-gradient(circle at 50% 42%, var(--canvas-1), var(--canvas-2));
    z-index:9999;
    transition: opacity .7s ease;
  }
  #site-loader.is-hidden{ opacity:0; pointer-events:none; }

  .loader{
    position:relative;
    width:clamp(168px, 24vw, 232px);
    aspect-ratio:1;
    display:flex; align-items:center; justify-content:center;
  }

  /* --- instrument ring (bezel + sweep) --- */
  .loader__ring{
    position:absolute; inset:0; width:100%; height:100%;
    opacity:0;
    animation: ringIn .5s ease-out .05s forwards; /* TIMING: ring fade-in */
  }
  @keyframes ringIn{ from{ opacity:0; transform:scale(.93); } to{ opacity:1; transform:scale(1); } }

  .ring-sweep{
    transform-box: fill-box; transform-origin:50% 50%;
    animation: ringSweep 2.6s linear infinite; /* TIMING: sweep speed */
    will-change: transform;
  }
  @keyframes ringSweep{ to{ transform:rotate(360deg); } }

  /* --- the mark itself --- */
  .loader__mark{
    position:absolute;
    inset:19%; /* centers a 62%-sized box regardless of parent layout mode */
    animation: markBreathe 4.2s ease-in-out 1.9s infinite; /* TIMING: idle breathing */
    transform-box: fill-box; transform-origin:50% 50%;
  }
  @keyframes markBreathe{ 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.018); } }

  .mark path{ transform-box: fill-box; transform-origin:50% 50%; }

  .wing{
    opacity:0;
    animation:
      wingIn .6s cubic-bezier(.34,1.56,.64,1) calc(.15s + var(--i) * .08s) 1 forwards,
      wingShimmer 2.8s ease-in-out calc(1.3s + var(--i) * .15s) infinite; /* TIMING: entrance stagger + shimmer */
  }
  @keyframes wingIn{
    0%{ opacity:0; transform:scale(.55) translateY(9px); }
    100%{ opacity:1; transform:scale(1) translateY(0); }
  }
  @keyframes wingShimmer{
    0%,100%{ filter:brightness(1); }
    50%{ filter:brightness(1.09); }
  }

  .eye-group{
    opacity:0;
    animation: eyeIn .55s cubic-bezier(.34,1.9,.64,1) 1.05s 1 forwards; /* TIMING: eye reveal moment */
  }
  @keyframes eyeIn{ 0%{ opacity:0; transform:scale(0); } 100%{ opacity:1; transform:scale(1); } }

  .eye-pulse{
    animation: eyePulse 1.7s ease-in-out 1.75s infinite; /* TIMING: eye pulse */
    will-change: transform, filter;
  }
  @keyframes eyePulse{
    0%,100%{ transform:scale(1); filter:drop-shadow(0 0 2px rgba(184,115,51,.5)); }
    50%{ transform:scale(1.13); filter:drop-shadow(0 0 9px rgba(184,115,51,.85)); }
  }

  .loader__flash{
    position:absolute; inset:0;
    border-radius:50%;
    background: radial-gradient(circle, rgba(184,115,51,.55), rgba(184,115,51,0) 68%);
    opacity:0;
    animation: flash .7s ease-out 1.05s 1; /* TIMING: synced to eye reveal */
    pointer-events:none;
  }
  @keyframes flash{ 0%{ opacity:0; } 45%{ opacity:.9; } 100%{ opacity:0; } }

  /* --- label --- */
  .loader__label{
    position:absolute; left:50%; bottom:-2.6em;
    transform:translateX(-50%);
    display:flex; align-items:center; gap:.5em;
    font-size:11px; font-weight:500; letter-spacing:.32em;
    color:var(--label-ink);
    opacity:0;
    animation: labelIn .5s ease-out .45s forwards; /* TIMING: label fade-in */
    white-space:nowrap;
  }
  @keyframes labelIn{ from{ opacity:0; transform:translate(-50%,4px); } to{ opacity:1; transform:translate(-50%,0); } }

  .label__dots{ display:inline-flex; gap:3px; }
  .dot{
    width:3px; height:3px; border-radius:50%;
    background:var(--copper);
    opacity:.25;
    animation: dotPulse 1.4s ease-in-out calc(.9s + var(--i) * .18s) infinite; /* TIMING: dot sequence */
  }
  @keyframes dotPulse{ 0%,100%{ opacity:.25; } 50%{ opacity:1; } }

  @media (prefers-reduced-motion: reduce){
    .loader__ring, .wing, .eye-group, .loader__label{
      animation:none !important; opacity:1 !important; transform:none !important;
    }
    .ring-sweep, .loader__mark, .eye-pulse, .dot, .loader__flash{ animation:none !important; }
    .dot{ opacity:.6 !important; }
  }

  /* ============ /LOADER ============ */

  /* demo-only placeholder page revealed once the loader dismisses */
  .page{
    min-height:100vh;
    display:flex; align-items:center; justify-content:center;
    text-align:center;
  }
  .page__note{
    font-family:'IBM Plex Mono', monospace;
    font-size:12px; letter-spacing:.08em;
    color:var(--label-ink);
    max-width:22em; line-height:1.7;
  }
</style>
</head>
<body>

<main class="page">
  <p class="page__note">Your page content goes here — this placeholder appears once #site-loader is dismissed.</p>
</main>

      <line x1="50" y1="1.5" x2="50" y2="7.5" stroke="var(--navy)" stroke-width="1.4" opacity=".38"/>
      <line x1="50" y1="92.5" x2="50" y2="98.5" stroke="var(--navy)" stroke-width="1" opacity=".16"/>
      <line x1="1.5" y1="50" x2="7.5" y2="50" stroke="var(--navy)" stroke-width="1" opacity=".16"/>
      <line x1="92.5" y1="50" x2="98.5" y2="50" stroke="var(--navy)" stroke-width="1" opacity=".16"/>
      <circle class="ring-sweep" cx="50" cy="50" r="46" fill="none" stroke="var(--copper)"
              stroke-width="2" stroke-linecap="round" stroke-dasharray="28 261"/>

          </g>

    </svg>

    <div class="loader__label">
      <span>LOADING</span>
      <span class="label__dots" aria-hidden="true">
        <span class="dot" style="--i:0"></span>
        <span class="dot" style="--i:1"></span>
        <span class="dot" style="--i:2"></span>
      </span>
    </div>

  </div>
</div>

<script>
  function hideLoader(){
    var el = document.getElementById('site-loader');
    if(!el) return;
    el.classList.add('is-hidden');
    el.addEventListener('transitionend', function(){ el.remove(); }, {once:true});
  }
  // DEMO ONLY — simulates a page taking ~4.4s to load, so you can see the
  // full cycle (assembly -> idle loop -> dismiss). In production, delete
  // this line and call hideLoader() from your real "ready" event instead.
  setTimeout(hideLoader, 4400);
</script>

</body>
</html>
